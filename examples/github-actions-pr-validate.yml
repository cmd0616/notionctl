# Validate notionctl config on pull requests
# Ensures template/config changes are valid before merge.
# Does NOT apply — just validates syntax and property types.
#
# Setup:
# 1. Copy this file to .github/workflows/notion-validate.yml
name: Validate Notion Config

on:
  pull_request:
    paths:
      - 'notionctl.yaml'
      - 'templates/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build notionctl
        run: go build -o notionctl .

      - name: Validate config
        run: |
          if [ -f notionctl.yaml ]; then
            echo "Validating notionctl.yaml..."
            ./notionctl plan 2>&1 || true
            # plan without NOTION_TOKEN will fail on apply but validates config parsing
          fi

      - name: Validate templates
        run: go test ./internal/config/... -run TestTemplatesValid -v
