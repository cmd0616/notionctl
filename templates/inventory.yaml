# Inventory Management template
# Usage: cp templates/inventory.yaml notionctl.yaml && notionctl plan
version: "1"

databases:
  - name: Products
    parent_page_id: "YOUR_PAGE_ID"
    properties:
      Name:
        type: title
      SKU:
        type: rich_text
      Price:
        type: number
        format: dollar
      Quantity:
        type: number
        format: number
      Category:
        type: select
        options:
          - name: Electronics
            color: blue
          - name: Clothing
            color: purple
          - name: Food
            color: green
          - name: Other
            color: gray
      Tags:
        type: multi_select
        options:
          - name: in-stock
            color: green
          - name: low-stock
            color: yellow
          - name: out-of-stock
            color: red
          - name: discontinued
            color: gray
      supplier:
        type: relation
        relation: Suppliers
      Total Value:
        type: formula
        expression: 'prop("Price") * prop("Quantity")'
      Discontinued:
        type: checkbox
      Updated:
        type: last_edited_time

  - name: Suppliers
    parent_page_id: "YOUR_PAGE_ID"
    properties:
      Name:
        type: title
      Contact:
        type: rich_text
      Email:
        type: email
      Phone:
        type: phone_number
      Website:
        type: url
      Region:
        type: select
        options:
          - name: Asia
            color: blue
          - name: Europe
            color: green
          - name: Americas
            color: orange
      products:
        type: relation
        relation: Products
      product_count:
        type: rollup
        relation: products
        rollup_property: Name
        function: count
