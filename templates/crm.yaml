# CRM (Customer Relationship Management) template
# Usage: cp templates/crm.yaml notionctl.yaml && notionctl plan
version: "1"

databases:
  - name: Contacts
    parent_page_id: "YOUR_PAGE_ID"
    properties:
      Name:
        type: title
      Email:
        type: email
      Phone:
        type: phone_number
      Company:
        type: rich_text
      Website:
        type: url
      Status:
        type: status
        options:
          - name: Lead
            color: gray
          - name: Prospect
            color: yellow
          - name: Customer
            color: green
          - name: Churned
            color: red
        groups:
          - name: To-do
            option_ids:
              - Lead
          - name: In progress
            option_ids:
              - Prospect
          - name: Complete
            option_ids:
              - Customer
              - Churned
      Last Contacted:
        type: date
      Updated:
        type: last_edited_time
      deals:
        type: relation
        relation: Deals

  - name: Deals
    parent_page_id: "YOUR_PAGE_ID"
    properties:
      Name:
        type: title
      Value:
        type: number
        format: dollar
      Stage:
        type: select
        options:
          - name: Discovery
            color: gray
          - name: Proposal
            color: blue
          - name: Negotiation
            color: yellow
          - name: Closed Won
            color: green
          - name: Closed Lost
            color: red
      Close Date:
        type: date
      Created:
        type: created_time
      contact:
        type: relation
        relation: Contacts
