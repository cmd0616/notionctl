name: Bug Report
description: Report a bug in notionctl
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: |
        Minimal steps to reproduce. Include your YAML config if relevant (redact IDs).
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: notionctl.yaml (if relevant)
      description: Paste your config (redact page IDs and tokens).
      render: yaml

  - type: input
    id: version
    attributes:
      label: notionctl version
      description: Output of `notionctl version`
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      description: e.g., macOS 14.0, Ubuntu 22.04, Windows 11
    validations:
      required: true
