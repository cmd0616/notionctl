name: Template Validation Comment

on:
  workflow_run:
    workflows: ["Validate Templates"]
    types: [completed]

jobs:
  comment:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Download validation result
        uses: actions/download-artifact@v4
        with:
          name: template-validation
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const prNumber = parseInt(fs.readFileSync('pr-number.txt', 'utf8').trim());
            const planOutput = fs.readFileSync('plan-output.md', 'utf8');
            const conclusion = '${{ github.event.workflow_run.conclusion }}';
            const icon = conclusion === 'success' ? '✅' : '❌';

            const body = `## ${icon} Template Validation

            ${planOutput}

            *Generated by [validate-templates](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${{ github.event.workflow_run.id }}) workflow*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Template Validation')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
