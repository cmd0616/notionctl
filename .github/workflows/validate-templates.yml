name: Validate Templates

on:
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build notionctl
        run: CGO_ENABLED=0 go build -o notionctl .

      - name: Validate templates and generate plan
        id: plan
        run: |
          set +e
          output=""
          has_error=false

          for template in templates/*.yaml; do
            name=$(basename "$template")
            echo "=== Validating $name ==="

            # Run plan with template as config
            result=$(./notionctl plan -c "$template" 2>&1)
            exit_code=$?

            if [ $exit_code -ne 0 ]; then
              has_error=true
              output="${output}### ❌ ${name}\n\`\`\`\n${result}\n\`\`\`\n\n"
            else
              output="${output}### ✅ ${name}\n\`\`\`\n${result}\n\`\`\`\n\n"
            fi
          done

          # Also validate the init template
          echo "=== Validating init template ==="
          ./notionctl init -c /tmp/init-test.yaml 2>/dev/null
          if [ -f /tmp/init-test.yaml ]; then
            result=$(./notionctl plan -c /tmp/init-test.yaml 2>&1)
            exit_code=$?
            if [ $exit_code -ne 0 ]; then
              has_error=true
              output="${output}### ❌ init template\n\`\`\`\n${result}\n\`\`\`\n\n"
            else
              output="${output}### ✅ init template\n\`\`\`\n${result}\n\`\`\`\n\n"
            fi
          fi

          # Write output to file for the comment step
          echo -e "$output" > /tmp/plan-output.md

          if [ "$has_error" = true ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('/tmp/plan-output.md', 'utf8');
            const status = '${{ steps.plan.outputs.status }}';
            const icon = status === 'success' ? '✅' : '❌';

            const body = `## ${icon} Template Validation

            ${planOutput}

            *Generated by [validate-templates](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) workflow*`;

            // Find existing comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Template Validation')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if validation failed
        if: steps.plan.outputs.status == 'failure'
        run: |
          echo "One or more templates failed validation"
          exit 1
