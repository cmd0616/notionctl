name: Validate Templates

on:
  pull_request:
    branches: [main]
    paths:
      - 'templates/**'
      - 'internal/**'
      - 'cmd/**'
      - 'go.mod'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build notionctl
        run: CGO_ENABLED=0 go build -o notionctl .

      - name: Validate templates and generate plan
        id: plan
        run: |
          set +e
          output=""
          has_error=false

          for template in templates/*.yaml; do
            name=$(basename "$template")
            echo "=== Validating $name ==="

            result=$(./notionctl plan -c "$template" 2>&1)
            exit_code=$?

            if [ $exit_code -ne 0 ]; then
              has_error=true
              output="${output}### ❌ ${name}\n\`\`\`\n${result}\n\`\`\`\n\n"
            else
              output="${output}### ✅ ${name}\n\`\`\`\n${result}\n\`\`\`\n\n"
            fi
          done

          echo "=== Validating init template ==="
          ./notionctl init -c /tmp/init-test.yaml 2>/dev/null
          if [ -f /tmp/init-test.yaml ]; then
            result=$(./notionctl plan -c /tmp/init-test.yaml 2>&1)
            exit_code=$?
            if [ $exit_code -ne 0 ]; then
              has_error=true
              output="${output}### ❌ init template\n\`\`\`\n${result}\n\`\`\`\n\n"
            else
              output="${output}### ✅ init template\n\`\`\`\n${result}\n\`\`\`\n\n"
            fi
          fi

          # Save plan output as artifact
          echo -e "$output" > /tmp/plan-output.md

          if [ "$has_error" = true ]; then
            echo "status=failure" >> "$GITHUB_OUTPUT"
          else
            echo "status=success" >> "$GITHUB_OUTPUT"
          fi

      - name: Save PR number
        run: echo "${{ github.event.pull_request.number }}" > /tmp/pr-number.txt

      - name: Upload validation result
        uses: actions/upload-artifact@v4
        with:
          name: template-validation
          path: |
            /tmp/plan-output.md
            /tmp/pr-number.txt
          retention-days: 1

      - name: Fail if validation failed
        if: steps.plan.outputs.status == 'failure'
        run: |
          echo "One or more templates failed validation"
          exit 1
