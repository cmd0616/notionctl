version: 2

project_name: notionctl

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - main: .
    binary: notionctl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/radityajay/notionctl/cmd.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

brews:
  - repository:
      owner: radityajay
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/radityajay/notionctl"
    description: "Declarative Notion database management. Define databases in YAML, sync to Notion."
    license: "MIT"
    install: |
      bin.install "notionctl"
    test: |
      system "#{bin}/notionctl", "version"
